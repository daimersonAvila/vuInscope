services:
  vulnscope:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]   # publish only to the local reverse proxy (TLS terminates there)
    volumes: ["vulnscope-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes: { vulnscope-data: {} }
